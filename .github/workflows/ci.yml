name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

# A newer push to the same branch supersedes older runs; tag runs gate deployment and always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verification:
    runs-on: ubuntu-latest
    # Tag runs may wait up to 30 minutes for main CI of the same commit.
    timeout-minutes: 35
    outputs:
      validation_required: ${{ steps.previous.outputs.validation_required }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve verification for this commit
        id: previous
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/deployment/verification.py

  build:
    needs: verification
    if: needs.verification.outputs.validation_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production bundles
        run: pnpm build
      - name: Share the production build
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            apps/web/dist/
            apps/server/dist/
          if-no-files-found: error
          retention-days: 3

  # Runs alongside the browser suites; both start from the shared build.
  quality:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test deployment automation
        run: python3 -m unittest discover -s scripts/deployment/tests -v

      - name: Install read-only sandbox runtime
        run: bash scripts/install-ci-bubblewrap.sh

      - name: Type check
        run: pnpm typecheck

      - name: Check the Web test time budget
        run: pnpm test:web:budget

      # Some server tests serve the built Web entry.
      - name: Download this run's production build
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: apps

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Run deployment smoke test
        run: pnpm test:deploy

  browsers:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chromium]
        shard: [1, 2]
    env:
      E2E_USE_PREBUILT: '1'
      PLAYWRIGHT_WS_ENDPOINT: ws://127.0.0.1:38191/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download this run's production build
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: apps
      - name: Install read-only sandbox runtime
        run: bash scripts/install-ci-bubblewrap.sh
      - name: Start version-matched browser runtime
        timeout-minutes: 4
        run: |
          docker run --detach --name playwright --network host --ipc host \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            node node_modules/@playwright/test/cli.js run-server --port 38191 --host 127.0.0.1
          for _ in {1..60}; do
            if curl --silent --output /dev/null http://127.0.0.1:38191/; then exit 0; fi
            sleep 1
          done
          docker logs playwright
          exit 1
      - name: Test ${{ matrix.project }} shard ${{ matrix.shard }}/2
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: pnpm test:e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2 2>&1 | tee "$RUNNER_TEMP/browser.log"
      - name: Save browser runtime logs
        if: always()
        run: docker logs playwright > "$RUNNER_TEMP/browser-runtime.log" 2>&1 || true
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/llm-chat-playwright-results-*/
            ${{ runner.temp }}/browser.log
            ${{ runner.temp }}/browser-runtime.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Stop browser runtime
        if: always()
        run: docker rm --force playwright || true

  verified:
    needs: [verification, build, quality, browsers]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all checks or successful verification of this exact commit
        env:
          RESOLUTION: ${{ needs.verification.result }}
          REQUIRED: ${{ needs.verification.outputs.validation_required }}
          BUILD: ${{ needs.build.result }}
          QUALITY: ${{ needs.quality.result }}
          BROWSERS: ${{ needs.browsers.result }}
        run: |
          test "$RESOLUTION" = success
          if [ "$REQUIRED" = true ]; then
            test "$BUILD" = success
            test "$QUALITY" = success
            test "$BROWSERS" = success
          else
            test "$REQUIRED" = false
            test "$BUILD" = skipped
            test "$QUALITY" = skipped
            test "$BROWSERS" = skipped
          fi

  deploy:
    needs: verified
    if: >-
      !cancelled() &&
      needs.verified.result == 'success' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      github.event.created == true &&
      github.event.deleted == false &&
      github.event.forced != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the CI-verified commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy and wait for readiness
        env:
          LLM_CHAT_DEPLOY_URL: ${{ vars.LLM_CHAT_DEPLOY_URL }}
          LLM_CHAT_DEPLOY_SECRET: ${{ secrets.LLM_CHAT_DEPLOY_SECRET }}
        run: python3 scripts/deployment/notify.py
