name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

# A newer push to the same branch supersedes older runs; tag runs gate deployment and always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verification:
    runs-on: ubuntu-latest
    # Tag runs may wait up to 30 minutes for main CI of the same commit.
    timeout-minutes: 35
    outputs:
      validation_required: ${{ steps.previous.outputs.validation_required }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve verification for this commit
        id: previous
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/deployment/verification.py

  # Online CI is a quick vitest gate; browser and e2e checks run locally on real devices.
  test:
    needs: verification
    if: needs.verification.outputs.validation_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The read-only shell tests require real Linux isolation.
      - name: Install read-only sandbox runtime
        run: bash scripts/install-ci-bubblewrap.sh
      # Some server tests serve the built Web entry.
      - name: Build production bundles
        run: pnpm build
      - name: Run unit tests
        run: pnpm test

  verified:
    needs: [verification, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require tests or successful verification of this exact commit
        env:
          RESOLUTION: ${{ needs.verification.result }}
          REQUIRED: ${{ needs.verification.outputs.validation_required }}
          TEST: ${{ needs.test.result }}
        run: |
          test "$RESOLUTION" = success
          if [ "$REQUIRED" = true ]; then
            test "$TEST" = success
          else
            test "$REQUIRED" = false
            test "$TEST" = skipped
          fi

  deploy:
    needs: verified
    if: >-
      !cancelled() &&
      needs.verified.result == 'success' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      github.event.created == true &&
      github.event.deleted == false &&
      github.event.forced != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the CI-verified commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy and wait for readiness
        env:
          LLM_CHAT_DEPLOY_URL: ${{ vars.LLM_CHAT_DEPLOY_URL }}
          LLM_CHAT_DEPLOY_SECRET: ${{ secrets.LLM_CHAT_DEPLOY_SECRET }}
        run: python3 scripts/deployment/notify.py
