name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test deployment automation
        run: python3 -m unittest discover -s scripts/deployment/tests -v

      - name: Install read-only sandbox runtime
        run: bash scripts/install-ci-bubblewrap.sh

      - name: Run quality checks
        run: pnpm check

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Run deployment smoke test
        run: pnpm test:deploy

      - name: Install Playwright browsers and system dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser end-to-end tests
        run: pnpm test:e2e

  deploy:
    needs: quality
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      github.event.created == true &&
      github.event.deleted == false &&
      github.event.forced != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the CI-verified commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy and wait for readiness
        env:
          LLM_CHAT_DEPLOY_URL: ${{ vars.LLM_CHAT_DEPLOY_URL }}
          LLM_CHAT_DEPLOY_SECRET: ${{ secrets.LLM_CHAT_DEPLOY_SECRET }}
        run: python3 scripts/deployment/notify.py
