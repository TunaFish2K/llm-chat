packages:
  - apps/*
  - packages/*

overrides:
  'fast-uri@>=3 <4': 3.1.8
  'fast-uri@>=4 <5': 4.1.5
  'ip-address@>=10 <11': 10.7.2
  'brace-expansion@>=2 <3': 2.1.7
  'brace-expansion@>=5 <6': 5.0.12

auditConfig:
  ignoreGhsas:
    # KaTeX: only exploitable after prototype pollution elsewhere; the fix is
    # 0.18, while rehype-katex and remark-math still require ^0.16.
    - GHSA-238p-pmpm-9mq7

allowBuilds:
  esbuild: true
  node-pty: true
  sharp: true

onlyBuiltDependencies:
  - esbuild
  - node-pty
